<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Devfolio | Sai{% endblock %}
    </title>

    <meta
        name="description"
        content="{% block description %}Sai's AI, Machine Learning and Full-Stack Developer Portfolio.{% endblock %}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/animations.css') }}"
    >
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a
                href="{{ url_for('home') }}#home"
                class="logo"
            >
                S<span>.</span>
            </a>

            <nav class="main-nav">

                <a
                    href="{{ url_for('home') }}#home"
                    class="nav-link active"
                >
                    Home
                </a>

                <a
                    href="{{ url_for('home') }}#about"
                    class="nav-link"
                >
                    About
                </a>

                <a
                    href="{{ url_for('home') }}#skills"
                    class="nav-link"
                >
                    Skills
                </a>

                <a
                    href="{{ url_for('home') }}#projects"
                    class="nav-link"
                >
                    Projects
                </a>

                <a
                    href="{{ url_for('home') }}#contact"
                    class="nav-link"
                >
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container footer-container">

            <div class="footer-left">
                <p>© 2026 Sai · Devfolio</p>
            </div>

            <div class="footer-right">
                <p>Think. Build. Learn.</p>
            </div>

        </div>

    </footer>


    {% block scripts %}
    {% endblock %}

</body>

</html>
